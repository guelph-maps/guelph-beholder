<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Guelph Address Beholder{% endblock %}</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/htmx.org@2.0.3"></script>
</head>
<body>
  <header class="topbar">
    <span class="brand">Guelph Address Beholder</span>
    <span class="tagline">Address coverage in OpenStreetMap, over time</span>
    <span class="auth">
      {% if current_user %}
        <span class="who">{{ current_user }}{% if not can_post %} <span class="muted">(read-only)</span>{% endif %}</span>
        <a href="{{ url_for('auth_logout') }}">Log out</a>
      {% else %}
        <a href="{{ url_for('auth_login') }}">Log in with OSM</a>
      {% endif %}
    </span>
  </header>
  {% block body %}{% endblock %}
</body>
</html>
