# Beholder configuration. Secrets live in .env, not here.

[city]
name = "Guelph"
# The City of Guelph address scraper DB (read-only) — the same tracker that
# feeds guelph-address-import, just read from the other side.
sqlite_path = "C:/Users/kk/Code/ontario-address-changes/data/guelph/guelph.db"
# Only rows carrying one of these STATUS values are tracked. Guelph publishes
# 'Active' on every row today; the filter exists so Proposed/Pending rows would
# be excluded rather than silently imported if that ever changes.
active_status_values = ["Active"]

[osm]
# Where to get current OSM address elements for conflation:
#   "overpass" - query Overpass live for the run bbox (~48k elements, ~20s)
#   "file"     - read a prebuilt JSON of Overpass elements (offline reruns)
source = "overpass"
file_path = ""
overpass_url = "https://overpass-api.de/api/interpreter"
api_base = "https://api.openstreetmap.org/api/0.6"
# Source-data extent plus a margin, verbatim from guelph-address-import's
# [osm] city_bbox. Guelph is a separated city wholly inside Wellington County,
# so the rectangle inevitably catches township addresses in the corners.
# [south, west, north, east].
city_bbox = [43.46, -80.34, 43.60, -80.14]

[conflation]
# A city address point is PRESENT if a matching OSM element sits within this
# radius. Same 100 m as guelph-address-import's [conflation] match_radius_m.
match_radius_m = 100.0

[beholder]
db_path = "data/beholder.db"
snapshot_dir = "data/snapshot"
cache_dir = "data/cache"

[notes]
preset_tags = [
    "Doesn't exist / demolished",
    "Merged into building",
    "Wrong location / bad data",
    "Unit not mapped separately",
]

[auth]
# OSM usernames allowed to post notes. Everyone else (logged in) is read-only.
# The dev-admin user (DEV_ADMIN_USER in .env) is always allowed when BEHOLDER_DEV is set.
allowlist = ["skfd"]
oauth_authorize_url = "https://www.openstreetmap.org/oauth2/authorize"
oauth_token_url = "https://www.openstreetmap.org/oauth2/token"
oauth_userinfo_url = "https://api.openstreetmap.org/api/0.6/user/details.json"
oauth_scope = "read_prefs"
# Shares the Toronto beholder's registered OSM OAuth2 app, so only one of the
# two can run at a time.
redirect_uri = "http://127.0.0.1:5000/auth/callback"
