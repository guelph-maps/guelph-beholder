# Guelph dataset config for the address-beholder engine.
# Secrets live in .env, not here. Run it with:
#   python ../address-beholder/run.py --dataset-dir . review

[dataset]
slug = "guelph"
name = "Guelph Addresses"
feature_type = "addresses"

[source]
# The City of Guelph address tracker DB (read-only) — the same tracker that
# feeds guelph-address-import, read from the other side.
sqlite_path = "C:/Users/kk/Code/ontario-address-changes/data/guelph/guelph.db"
# Guelph publishes 'Active' on every row today; the filter exists so
# Proposed/Pending rows would be excluded rather than silently tracked.
active_status_values = ["Active"]

[source_fields]
number_from = "number"
# FULLNAME is already OSM long form ("Cork Street West").
street_from = "street"
# NOT "full": Guelph's ADDRESS column appends the unit ("44 Regent Street B"),
# which is not an address anyone writes.
full_from = "number+street"
# 13,162 of 53,846 rows carry a unit, and the beholder tracks every one as its
# own point. What it expects to find changed on 2026-09-15: a unit is PRESENT
# either as its own node, or when the civic node lists it in `addr:flats`.
#
# The line this replaces said "a unit is a real door and is expected to be its
# own node in OSM". That is false for about half of them. The importer's
# classifier (address-importer-friend t2/units.py) splits Guelph's 514
# multi-unit groups by their numbering: floor- or building-coded units are
# stacked suites that get one node for the building, sequential ones are front
# doors that get a node each. This dataset's own history is the evidence the
# split is real — scored against it, suite units read 96.2% MISSING and door
# units 17.3%. Mappers mapped the doors and left the suites, which is what the
# rule predicts, and 5,453 of the 8,449 MISSING were suites that were never
# going to be nodes.
#
# Three Guelph buildings have a listing too long for OSM's 255-character tag
# limit (85 Mullin Drive's 110 units run to 421), so the importer writes no
# `addr:flats` for them and their units stay MISSING. Left that way on purpose:
# the residue is real and countable rather than special-cased away.
#
# **The mismatch signal.** A unit the City *adds* to an already-mapped building
# reads MISSING against a listing that has not caught up — which is exactly the
# maintenance alarm the importer cannot raise, because its per-door-or-collapse
# path only creates nodes and cannot modify an existing `addr:flats`. The
# mirror case is a genuine blind spot: a unit the City *retires* while OSM goes
# on listing it is invisible here, because this tracks source points and a
# retired row is no longer one. Catching that needs a check on the OSM side,
# comparing the listing against the group, and nothing does it yet.
unit = "unit"
# 'Guelph' on 53,771 rows, 'Guelph/Eramosa Twp' on 75 — the one subdivision the
# city publishes past its own boundary. Declared so those stay distinguishable,
# and so addr:city is checked against what the source actually says.
municipality = "props:PLACE"
ward = "props:WARD"
postcode = "props:POSTCODE"
status = "props:STATUS"
# No address_class, and no ranges: verified against the 19 props keys.

[streets]
# Empty on purpose. Guelph's source street and OSM agree so far — a street where
# every point reads MISSING is the tell that an entry belongs here.
overrides = {}

[osm]
source = "overpass"
overpass_url = "https://overpass-api.de/api/interpreter"
api_base = "https://api.openstreetmap.org/api/0.6"
# Verbatim from guelph-address-import's [osm] city_bbox. Guelph is a separated
# city wholly inside Wellington County, so the rectangle catches township
# addresses in the corners. [south, west, north, east].
city_bbox = [43.46, -80.34, 43.60, -80.14]

[conflation]
match_radius_m = 100.0
# Guelph's double-encoded housenumbers, in readings.py. Delete both the file and
# this line when the split campaign lands.
readings = ["readings:READINGS"]

[audit]
far_match_m = 40.0
# The 2025 import's leftover, on 44,891 of 48,344 elements as of 2026-08-28.
# Its own cleanup campaign, kept out of headline counts and the map layer.
deprecated_tags = ["addr:province"]
# The published tagging plan promises addr:city=Guelph, and the 2025 import
# wrote addr:postcode from this same source, so both absences are real defects
# here. Toronto expects neither.
expect_tags = ["addr:city", "addr:postcode"]

[beholder]
db_path = "data/beholder.db"
snapshot_dir = "data/snapshot"
cache_dir = "data/cache"

[notes]
preset_tags = [
    "Doesn't exist / demolished",
    "Merged into building",
    "Wrong location / bad data",
    "Unit not mapped separately",
]

[auth]
allowlist = ["skfd"]
oauth_authorize_url = "https://www.openstreetmap.org/oauth2/authorize"
oauth_token_url = "https://www.openstreetmap.org/oauth2/token"
oauth_userinfo_url = "https://api.openstreetmap.org/api/0.6/user/details.json"
oauth_scope = "read_prefs"
# Shares the Toronto dataset's registered OSM OAuth2 app, so only one of the two
# can be served at a time.
redirect_uri = "http://127.0.0.1:5000/auth/callback"
