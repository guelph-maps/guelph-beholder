[project]
name = "guelph-beholder"
version = "0.1.0"
description = "Audit completeness of Guelph address coverage in OpenStreetMap over time."
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    "requests>=2.31",
    "authlib>=1.3",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["beholder*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
